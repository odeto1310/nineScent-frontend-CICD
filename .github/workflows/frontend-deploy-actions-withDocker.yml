name: Frontend CI/CD with Docker and GitHub Actions

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 🏗️ Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ninescent-frontend:latest
          platforms: linux/amd64,linux/arm64

  deploy:
    name: 🚀 Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📦 SSH to EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s
          script: |
            echo "🔧 Stop & remove old container"
            docker stop frontend-container || true
            docker rm frontend-container || true

            echo "🐳 Pull latest Docker image"
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/ninescent-frontend:latest

            echo "🚀 Run new container"
            docker run -d \
              --name frontend-container \
              --network frontend-network \
              -p 8081:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/ninescent-frontend:latest

            echo "🌐 Restart Nginx"
            sudo systemctl restart nginx
